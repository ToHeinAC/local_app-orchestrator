# ai.brenk.com HTTPS offload / SSL termination
# 2026_05_05 HEF
# 2026_07_17 subpath routing for the Streamlit apps
#
# Install on the reverse proxy (172.16.4.11:222) as
#   /etc/nginx/sites-enabled/ai.brenk.com.conf
# then:
#   nginx -t && systemctl reload nginx.service
# Reload, never restart — a restart drops every connection, other domains included.
#
# ---------------------------------------------------------------------------
# Each app is a Streamlit server on its own port on 172.16.4.112. Streamlit
# emits *relative* asset links (./static/...), so an app served under a subpath
# only works if two things agree:
#
#   1. this file:            location /wiwi/  ->  port 8520
#   2. the app's own config: [server] baseUrlPath = "wiwi"   (.streamlit/config.toml)
#
# If baseUrlPath is missing, the app answers on /wiwi with HTTP 200 (it reads
# "wiwi" as a multipage page name) but its ./static/ links resolve to /static/,
# which lands on the orchestrator at location / — wrong bundle, blank page.
#
# The trailing slash is load-bearing. On /wiwi (no slash) ./static/ resolves to
# /static/; on /wiwi/ it resolves to /wiwi/static/. Streamlit would redirect
# /wiwi -> /wiwi/ itself, but it builds that redirect as an absolute http:// URL
# from the Host header (it ignores X-Forwarded-Proto), which downgrades HTTPS.
# So the `location = /wiwi` blocks below do the redirect here instead, and the
# request never reaches Streamlit without its slash.
#
# The orchestrator (8550) sits at / and must NOT have a baseUrlPath.
#
# Adding an app: copy a redirect + proxy block pair, set path and port, and set
# the matching baseUrlPath in that app's .streamlit/config.toml.
# ---------------------------------------------------------------------------

# Streamlit is a WebSocket app. This maps the client's Upgrade header to the
# right Connection value: "upgrade" for the WebSocket, "close" otherwise.
# Setting Connection to a fixed value breaks one of the two cases.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen *:444 ssl;
    server_name ai.brenk.com;
    ssl_certificate     certs/brenk.com.server.pem;
    ssl_certificate_key certs/brenk.com.key;

    # Logging
    access_log /var/log/nginx/ai.brenk.com.access.log;
    error_log  /var/log/nginx/ai.brenk.com.error.log;

    # --- Orchestrator (directory page) — no baseUrlPath, lives at the root ---
    location / {
        proxy_pass http://172.16.4.112:8550;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 1000;
        proxy_send_timeout 1000;
    }

    # --- BrAIn — baseUrlPath = "brain" ---
    location = /brain { return 308 /brain/; }
    location /brain/ {
        proxy_pass http://172.16.4.112:8511;   # no trailing slash: keep the /brain/ prefix
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 1000;
        proxy_send_timeout 1000;
    }

    # --- KI-WissensWiki — baseUrlPath = "wiwi" ---
    location = /wiwi { return 308 /wiwi/; }
    location /wiwi/ {
        proxy_pass http://172.16.4.112:8520;   # no trailing slash: keep the /wiwi/ prefix
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 1000;
        proxy_send_timeout 1000;
    }

    # --- KI-Zusammenfassung — baseUrlPath = "smrz" ---
    location = /smrz { return 308 /smrz/; }
    location /smrz/ {
        proxy_pass http://172.16.4.112:8530;   # no trailing slash: keep the /smrz/ prefix
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 1000;
        proxy_send_timeout 1000;
    }

    # --- KI-Übersetzer — baseUrlPath = "trns" ---
    location = /trns { return 308 /trns/; }
    location /trns/ {
        proxy_pass http://172.16.4.112:8560;   # no trailing slash: keep the /trns/ prefix
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 1000;
        proxy_send_timeout 1000;
    }
}
